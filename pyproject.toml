[project]
name = "diagrambench"
version = "0.2.0"
description = "DiagramBench: a lifelong tool-learning benchmark around SIGIL, a novel compiled visualization language."
readme = "README.md"
authors = [
    { name = "Ilija Lichkovski", email = "ilija.lichkovski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "verifiers==0.2.0",
]

[tool.uv]
# virtual project: the workspace itself is not an installable package —
# the benchmark ships as environments/diagrambench-v1
package = false
